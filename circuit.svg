<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 320" width="420" height="320" role="img" aria-label="Animated circuit diagram connecting machine learning, networking, security, data analytics, web scraping and PCB design" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.18"/>
    </pattern>
    <path id="p1" d="M82 60 H118 V135 H155"/>
    <path id="p2" d="M82 160 H155"/>
    <path id="p3" d="M82 260 H118 V185 H155"/>
    <path id="p4" d="M265 135 H302 V60 H338"/>
    <path id="p5" d="M265 160 H338"/>
    <path id="p6" d="M265 185 H302 V260 H338"/>
  </defs>

  <rect x="1" y="1" width="418" height="318" rx="18" fill="#0b1220" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="1" y="1" width="418" height="318" rx="18" fill="url(#dots)"/>

  <g fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.45" stroke-linejoin="round">
    <use xlink:href="#p1"/><use xlink:href="#p2"/><use xlink:href="#p3"/>
    <use xlink:href="#p4"/><use xlink:href="#p5"/><use xlink:href="#p6"/>
  </g>

  <g fill="#7dd3fc">
    <circle r="3.5"><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#p1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath xlink:href="#p2"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3s" begin="1.2s" repeatCount="indefinite"><mpath xlink:href="#p3"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3s" begin="0.3s" repeatCount="indefinite"><mpath xlink:href="#p4"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite"><mpath xlink:href="#p5"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite"><mpath xlink:href="#p6"/></animateMotion></circle>
  </g>

  <!-- centre chip -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.7">
    <path d="M145 135H155M145 160H155M145 185H155M265 135H275M265 160H275M265 185H275"/>
  </g>
  <rect x="155" y="120" width="110" height="80" rx="10" fill="#0b1220" stroke="url(#accent)" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="1;0.55;1" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <text x="210" y="158" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="url(#accent)">BEI</text>
  <text x="210" y="178" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" letter-spacing="2" fill="#94a3b8">ENGINEER</text>

  <!-- skill nodes -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <g>
      <circle cx="60" cy="60" r="22" fill="#10233d" stroke="#2dd4bf" stroke-width="2"/>
      <text x="60" y="64" font-size="11" font-weight="700" fill="#e2e8f0">ML</text>
      <text x="60" y="98" font-size="10" fill="#94a3b8">Machine Learning</text>
    </g>
    <g>
      <circle cx="60" cy="160" r="22" fill="#10233d" stroke="#38bdf8" stroke-width="2"/>
      <text x="60" y="164" font-size="11" font-weight="700" fill="#e2e8f0">NET</text>
      <text x="60" y="198" font-size="10" fill="#94a3b8">Networking</text>
    </g>
    <g>
      <circle cx="60" cy="260" r="22" fill="#10233d" stroke="#2dd4bf" stroke-width="2"/>
      <text x="60" y="264" font-size="11" font-weight="700" fill="#e2e8f0">SEC</text>
      <text x="60" y="298" font-size="10" fill="#94a3b8">Security</text>
    </g>
    <g>
      <circle cx="360" cy="60" r="22" fill="#10233d" stroke="#38bdf8" stroke-width="2"/>
      <text x="360" y="64" font-size="11" font-weight="700" fill="#e2e8f0">DATA</text>
      <text x="360" y="98" font-size="10" fill="#94a3b8">Data Analytics</text>
    </g>
    <g>
      <circle cx="360" cy="160" r="22" fill="#10233d" stroke="#2dd4bf" stroke-width="2"/>
      <text x="360" y="164" font-size="11" font-weight="700" fill="#e2e8f0">WEB</text>
      <text x="360" y="198" font-size="10" fill="#94a3b8">Web Scraping</text>
    </g>
    <g>
      <circle cx="360" cy="260" r="22" fill="#10233d" stroke="#38bdf8" stroke-width="2"/>
      <text x="360" y="264" font-size="11" font-weight="700" fill="#e2e8f0">PCB</text>
      <text x="360" y="298" font-size="10" fill="#94a3b8">PCB Design</text>
    </g>
  </g>
</svg>
