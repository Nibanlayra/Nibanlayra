<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Nabin Aryal, Electronics and Communication Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#FF512F"/>
      <stop offset="0.33" stop-color="#DD2476"/>
      <stop offset="0.66" stop-color="#7F00FF"/>
      <stop offset="1" stop-color="#00C6FF"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- floating bubbles -->
  <g>
    <circle cx="703" cy="68" r="11" fill="#ffffff" fill-opacity="0.25"><animate attributeName="cy" values="68;57;68" dur="7.6s" repeatCount="indefinite"/></circle>
    <circle cx="232" cy="123" r="14" fill="#ffffff" fill-opacity="0.12"><animate attributeName="cy" values="123;105;123" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="116" cy="52" r="11" fill="#ffffff" fill-opacity="0.12"><animate attributeName="cy" values="52;39;52" dur="6.7s" repeatCount="indefinite"/></circle>
    <circle cx="909" cy="45" r="14" fill="#ffffff" fill-opacity="0.25"><animate attributeName="cy" values="45;32;45" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="166" cy="177" r="14" fill="#ffffff" fill-opacity="0.12"><animate attributeName="cy" values="177;164;177" dur="6.6s" repeatCount="indefinite"/></circle>
    <circle cx="312" cy="104" r="11" fill="#ffffff" fill-opacity="0.25"><animate attributeName="cy" values="104;93;104" dur="5.6s" repeatCount="indefinite"/></circle>
    <circle cx="671" cy="173" r="15" fill="#ffffff" fill-opacity="0.25"><animate attributeName="cy" values="173;154;173" dur="5.7s" repeatCount="indefinite"/></circle>
    <circle cx="424" cy="125" r="6" fill="#ffffff" fill-opacity="0.25"><animate attributeName="cy" values="125;114;125" dur="7.2s" repeatCount="indefinite"/></circle>
    <circle cx="162" cy="188" r="8" fill="#ffffff" fill-opacity="0.18"><animate attributeName="cy" values="188;170;188" dur="7.0s" repeatCount="indefinite"/></circle>
    <circle cx="683" cy="149" r="14" fill="#ffffff" fill-opacity="0.18"><animate attributeName="cy" values="149;134;149" dur="8.7s" repeatCount="indefinite"/></circle>
    <circle cx="548" cy="76" r="16" fill="#ffffff" fill-opacity="0.25"><animate attributeName="cy" values="76;65;76" dur="8.1s" repeatCount="indefinite"/></circle>
    <circle cx="654" cy="164" r="12" fill="#ffffff" fill-opacity="0.18"><animate attributeName="cy" values="164;143;164" dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="629" cy="185" r="6" fill="#ffffff" fill-opacity="0.12"><animate attributeName="cy" values="185;169;185" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="68" r="12" fill="#ffffff" fill-opacity="0.12"><animate attributeName="cy" values="68;48;68" dur="6.7s" repeatCount="indefinite"/></circle>
    
  </g>

  <!-- animated waves -->
  <path fill="#ffffff" fill-opacity="0.16" d="M0 236 C75 206 225 266 300 236 C375 206 525 266 600 236 C675 206 825 266 900 236 C975 206 1125 266 1200 236 C1275 206 1425 266 1500 236 V280 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#ffffff" fill-opacity="0.12" d="M-300 246 C-225 226 -75 266 0 246 C75 226 225 266 300 246 C375 226 525 266 600 246 C675 226 825 266 900 246 C975 226 1125 266 1200 246 V280 H-300 Z">
    <animateTransform attributeName="transform" type="translate" from="-300 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- text -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="600" y="122" font-size="68" font-weight="800" letter-spacing="1.5" filter="url(#shadow)">Nabin Aryal</text>
    <text x="600" y="166" font-size="20" font-weight="600" letter-spacing="5" fill-opacity="0.95">ELECTRONICS &amp; COMMUNICATION ENGINEER</text>
    <rect x="560" y="182" width="80" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.85" text-anchor="middle"/>
    <text x="600" y="214" font-size="16" letter-spacing="1.2" fill-opacity="0.9">Machine Learning  ·  Networking  ·  Security  ·  Web Scraping  ·  Data Analytics  ·  PCB Design</text>
  </g>
</svg>
